<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; form-action 'none'; base-uri 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Topper Terminal 登录</title>
    <link rel="stylesheet" href="login.css">
    <script defer src="login.js"></script>
</head>
<body>
    <main>
        <div class="brand"><img src="../topper-terminal.png" alt="" width="24" height="24"> Topper Terminal</div>
        <h1>登录终端</h1>
        <p id="description">使用 Topper Terminal 账号登录。</p>
        <form>
            <label for="email">邮箱</label>
            <input id="email" name="email" type="email" autocomplete="username" maxlength="254" required autofocus>
            <label for="password">密码</label>
            <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
            <p id="status" role="status" aria-live="polite"></p>
            <button id="submit" type="submit" disabled>登录</button>
            <button id="switch-mode" type="button" disabled>创建账号</button>
        </form>
    </main>
</body>
</html>
